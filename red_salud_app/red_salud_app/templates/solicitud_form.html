{% include 'encabezado.html' %}

<h1 class="titulo">Editar solicitud {{Solicitud[0]}}</h1>
<p class="sub">{{Solicitud[9]}} ({{Solicitud[10]}}) · {{Solicitud[8]}}. Lo que se pide no cambia; para eso cancela y registra otra.</p>

<div class="panel formulario">
<!-- inicio formulario -->
<form action="/actualizarsolicitud" method="POST" class="validar">
  <input type="hidden" name="id_solicitud" value="{{Solicitud[0]}}">
  <div class="campos">
    <div><label for="id_urgencia">Urgencia *</label>
         <select id="id_urgencia" name="id_urgencia" required>
           {% for u in Urgencias %}<option value="{{u[0]}}" {% if Solicitud[2] == u[0] %}selected{% endif %}>{{u[1]}}</option>{% endfor %}
         </select></div>
    <div><label for="fecha_limite">Fecha límite *</label>
         <input type="datetime-local" id="fecha_limite" name="fecha_limite" required data-futura
                value="{{Solicitud[5].strftime('%Y-%m-%dT%H:%M') if Solicitud[5] else ''}}"></div>
    <div class="ancho"><label for="motivo">Motivo *</label>
         <input type="text" id="motivo" name="motivo" maxlength="255" required value="{{Solicitud[6]}}"></div>
    <div class="ancho"><label for="observaciones">Observaciones</label>
         <textarea id="observaciones" name="observaciones" rows="3">{{Solicitud[7] or ''}}</textarea></div>
  </div>
  <button class="btn" type="submit">Guardar</button>
  <a class="btn btn-sec" href="/solicitud/{{Solicitud[0]}}">Cancelar</a>
</form>
<!-- fin formulario -->
</div>
