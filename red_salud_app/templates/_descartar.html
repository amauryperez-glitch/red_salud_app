<details class="accion"><summary>Descartar</summary>
  <div class="caja-accion">
  <form action="{{ url_for('descartar') }}" method="POST" class="validar" data-confirmar="¿Descartar este recurso? No se puede deshacer.">
    <input type="hidden" name="id_recurso" value="{{ id_recurso }}">
    <input type="hidden" name="regresar" value="{{ request.full_path }}">
    <label>Causa</label>
    <select name="id_causa">{% for c in causas_descarte %}<option value="{{ c.id }}">{{ c.nombre }}</option>{% endfor %}</select>
    <label class="separado">Motivo *</label>
    <input type="text" name="motivo" required>
    <button class="btn btn-peligro btn-chico separado" type="submit">Descartar</button>
  </form>
  </div>
</details>
