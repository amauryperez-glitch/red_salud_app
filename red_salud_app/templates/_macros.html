{# opciones de un <select>; "sel" es el valor elegido (se compara como texto) #}
{% macro opciones(lista, sel=None, vacio=None) -%}
  {% if vacio is not none %}<option value="">{{ vacio }}</option>{% endif %}
  {% for o in lista %}<option value="{{ o.id }}" {% if sel is not none and sel|string == o.id|string %}selected{% endif %}>{{ o.nombre }}</option>{% endfor %}
{%- endmacro %}

{# opciones donde el valor es el nombre (para filtrar vistas por texto) #}
{% macro opciones_nombre(lista, sel='', vacio='Todos') -%}
  <option value="">{{ vacio }}</option>
  {% for o in lista %}<option value="{{ o.nombre }}" {% if sel == o.nombre %}selected{% endif %}>{{ o.nombre }}</option>{% endfor %}
{%- endmacro %}

{% macro etiqueta(texto) -%}
  <span class="etiqueta {{ texto|clase }}">{{ texto }}</span>
{%- endmacro %}

{# campos comunes de persona (donante, receptor, personal) #}
{% macro campos_persona(v, sexos, edad_min=None, edad_max=None) -%}
  <div><label for="nombres">Nombres *</label>
       <input type="text" id="nombres" name="nombres" maxlength="100" required value="{{ v.nombres or '' }}"></div>
  <div><label for="apellidos">Apellidos *</label>
       <input type="text" id="apellidos" name="apellidos" maxlength="100" required value="{{ v.apellidos or '' }}"></div>
  <div><label for="fecha_nacimiento">Fecha de nacimiento *</label>
       <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required value="{{ v.fecha_nacimiento or '' }}"
              data-no-futura {% if edad_min %}data-edad-min="{{ edad_min }}"{% endif %} {% if edad_max %}data-edad-max="{{ edad_max }}"{% endif %}></div>
  <div><label for="id_sexo">Sexo *</label>
       <select id="id_sexo" name="id_sexo" required>{{ opciones(sexos, v.id_sexo, 'Selecciona') }}</select></div>
  <div><label for="correo">Correo electrónico</label>
       <input type="email" id="correo" name="correo" maxlength="150" value="{{ v.correo or '' }}"></div>
  <div><label for="telefono">Teléfono (10 a 15 dígitos)</label>
       <input type="tel" id="telefono" name="telefono" maxlength="15" pattern="[0-9]{10,15}"
              title="Solo números, de 10 a 15 dígitos" placeholder="8112345678" value="{{ v.telefono or '' }}"></div>
{%- endmacro %}
