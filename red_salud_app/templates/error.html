{% extends 'base.html' if session.get('id_usuario') else 'error_simple.html' %}
{% block titulo %}{{ titulo or 'Error' }}{% endblock %}
{% block contenido %}
<h1 class="titulo">{{ titulo or 'No se pudo completar la operación' }}</h1>
<div class="mensaje error">{{ mensaje }}</div>
<p><a class="btn btn-sec" href="{{ url_for('inicio') if session.get('id_usuario') else url_for('principal') }}">Volver</a></p>
{% endblock %}
